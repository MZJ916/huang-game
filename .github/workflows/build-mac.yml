name: Build Mac App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --windowed --name "HuangGame" huang_game.py

      - name: Zip the App
        run: |
          cd dist
          zip -r HuangGame-mac.zip HuangGame.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuangGame-mac
          path: dist/HuangGame-mac.zip
